<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // Sets the theme class before first paint: the stored choice, else the system's.
      (function () {
        var query = "(prefers-color-scheme: dark)";
        var dark;
        try {
          var stored = localStorage.getItem("pluto-preview-theme");
          dark = stored ? stored === "dark" : matchMedia(query).matches;
        } catch (e) {
          dark = matchMedia(query).matches;
        }
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
