# 022: the test matrix. Every browser suite in Chromium, Firefox and WebKit;
# the screen-reader suite under VoiceOver (macOS) and NVDA (Windows); the
# rest of `bun run test`. One job, `gate`, says whether the run is green, and
# the release check refuses a tag without a green push run of HEAD.
#
# Agents never push. The owner pushes, and dispatches the mutation run with
#   gh workflow run matrix.yml --ref release/0.13.0 -f mutate=true
name: matrix
run-name: ${{ inputs.mutate && format('matrix (mutation {0})', inputs.set) || 'matrix' }}

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]
  workflow_dispatch:
    inputs:
      mutate:
        description: "Apply a set from tests/sr/mutations/ and expect exactly its faults"
        type: boolean
        default: false
      set:
        description: "Which mutation set"
        type: choice
        options: [main, double-read]
        default: main

permissions:
  contents: read
  actions: read

# Grouped by commit, never by branch, except for pull requests (022 decision 5).
concurrency:
  group: >-
    matrix-${{ github.event_name == 'pull_request'
      && format('pr-{0}', github.ref)
      || format('{0}-{1}', github.sha,
           inputs.mutate && format('mutation-{0}', inputs.set) || 'full') }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # A pull request from this repository runs nothing; its push run is the evidence.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - if: ${{ inputs.mutate }}
        run: git apply tests/sr/mutations/"$MUTATION_SET"/*.patch
        env:
          MUTATION_SET: ${{ inputs.set }}
      - run: bun run build
      - run: tar -cf site.tar build .svelte-kit/output
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site.tar
          if-no-files-found: error
          retention-days: 1

  checks:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork) && !inputs.mutate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.64.1-chromium
      # The smoke test opens a scratch app in Chromium.
      - run: bun --bun playwright install --with-deps chromium
      - run: bun run test:unit
      - run: bun run check
      - run: bun run lint
      - run: bun scripts/lint-literals.ts
      - run: bun run test:smoke

  browsers:
    needs: build
    if: ${{ !inputs.mutate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.64.1-${{ matrix.engine }}
      - run: bun --bun playwright install --with-deps ${{ matrix.engine }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
      - run: |
          tar -xf site.tar
          test -f build/index.html
          test -f .svelte-kit/output/server/manifest.js
      - run: bun --bun playwright test --project="${{ matrix.engine }}-*" --shard=${{ matrix.shard }}/8
        env:
          CI: "true"
          E2E_PREBUILT: "1"
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ matrix.engine }}-${{ matrix.shard }}.zip
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-${{ matrix.engine }}-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

  perf:
    needs: build
    if: ${{ !inputs.mutate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.64.1-chromium
      - run: bun --bun playwright install --with-deps chromium
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
      - run: |
          tar -xf site.tar
          test -f build/index.html
          test -f .svelte-kit/output/server/manifest.js
      # 022 decision 8: alone on its own runner, so no dependency on the
      # Chromium projects. Q1: LCP is reported, transfer gates.
      - run: bun --bun playwright test --project=perf
        env:
          CI: "true"
          E2E_PREBUILT: "1"
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-perf.zip
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-perf
          path: blob-report/
          retention-days: 1

  voiceover:
    needs: build
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, chromium]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run sr:setup --macos-record
      - run: bun run sr:install
      - run: bun --bun playwright install ${{ matrix.browser }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
      - run: |
          tar -xf site.tar
          test -f build/index.html
          test -f .svelte-kit/output/server/manifest.js
      - run: bun run test:sr --project=${{ matrix.browser }}
        env:
          CI: "true"
          E2E_PREBUILT: "1"
          SR_READER: voiceover
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-voiceover-${{ matrix.browser }}.zip
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sr-voiceover-${{ matrix.browser }}
          path: |
            blob-report/
            test-results/
            recordings/
          retention-days: 14

  nvda:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run sr:setup
      - run: bun run sr:install
      - run: bun --bun playwright install ${{ matrix.browser }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
      - run: |
          tar -xf site.tar
          test -f build/index.html
          test -f .svelte-kit/output/server/manifest.js
      - run: bun run test:sr --project=${{ matrix.browser }}
        env:
          CI: "true"
          E2E_PREBUILT: "1"
          SR_READER: nvda
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-nvda-${{ matrix.browser }}.zip
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sr-nvda-${{ matrix.browser }}
          path: |
            blob-report/
            test-results/
          retention-days: 14

  report:
    needs: [build, browsers, perf, voiceover, nvda]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-*
          path: all-blob-reports
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sr-*
          path: sr
      - run: |
          mkdir -p all-blob-reports sr
          find sr -path '*/blob-report/*.zip' -exec cp {} all-blob-reports/ \;
          ls all-blob-reports
      - run: bun --bun playwright merge-reports -c playwright.merge.config.ts all-blob-reports
      # The summary, the screen-reader logs, the ledger-mismatch check and,
      # on a mutation run, the comparison with the set's expected.json.
      - run: bun scripts/ci/report.ts
        env:
          MUTATE: ${{ inputs.mutate }}
          MUTATION_SET: ${{ inputs.set }}
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: matrix-report
          path: |
            matrix-report/
            sr/*/recordings/
          retention-days: 14

  gate:
    if: ${{ always() }}
    needs: [build, checks, browsers, perf, voiceover, nvda, report]
    runs-on: ubuntu-24.04
    timeout-minutes: 100 # a same-repository pull request waits for its push run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun scripts/ci/gate.ts
        env:
          NEEDS: ${{ toJSON(needs) }}
          MUTATE: ${{ inputs.mutate }}
          MUTATION_SET: ${{ inputs.set }}
          SAME_REPO_PR: ${{ github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
